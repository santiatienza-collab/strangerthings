<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a01428">
<meta name="mobile-web-app-capable" content="yes">
<title>Stranger Slug – Shoot &amp; Run en el Mundo del Revés</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { --u: 1vh; }
  @supports (height: 1dvh) { :root { --u: 1dvh; } }
  html, body { margin: 0; height: 100%; background: #07010a; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: #000; display: block; outline: none; touch-action: none;
  }
  @supports (height: 1dvh) {
    canvas { width: min(100vw, calc(100dvh * 16 / 9)); height: min(100dvh, calc(100vw * 9 / 16)); }
  }

  /* ---- controles táctiles (solo con body.touch: móviles y tablets Android) ---- */
  #touch, #rotate, #install { display: none; }
  body.touch #touch { display: block; position: fixed; inset: 0; z-index: 5; pointer-events: none; touch-action: none; }
  #touch > * { pointer-events: auto; touch-action: none; }

  #dpad { position: absolute; left: calc(var(--u) * 4); bottom: calc(var(--u) * 5); width: calc(var(--u) * 42); height: calc(var(--u) * 42); }
  #dpad i, .tb {
    position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .10); border: calc(var(--u) * .5) solid rgba(255, 255, 255, .38);
    color: rgba(255, 255, 255, .62); font: 700 calc(var(--u) * 2.6) monospace; letter-spacing: 0;
  }
  #dpad i { width: calc(var(--u) * 14); height: calc(var(--u) * 14); border-radius: calc(var(--u) * 3); }
  #dpad i::before { content: ''; width: 46%; height: 46%; background: currentColor; }
  #dpad [data-d=up]    { left: calc(var(--u) * 14); top: 0; }
  #dpad [data-d=left]  { left: 0; top: calc(var(--u) * 14); }
  #dpad [data-d=right] { left: calc(var(--u) * 28); top: calc(var(--u) * 14); }
  #dpad [data-d=down]  { left: calc(var(--u) * 14); top: calc(var(--u) * 28); }
  #dpad [data-d=up]::before    { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  #dpad [data-d=down]::before  { clip-path: polygon(0 0, 100% 0, 50% 100%); }
  #dpad [data-d=left]::before  { clip-path: polygon(100% 0, 100% 100%, 0 50%); }
  #dpad [data-d=right]::before { clip-path: polygon(0 0, 100% 50%, 0 100%); }

  .tb { border-radius: 50%; }
  .tb[data-a=fire] { right: calc(var(--u) * 4);  bottom: calc(var(--u) * 5);  width: calc(var(--u) * 23); height: calc(var(--u) * 23); }
  .tb[data-a=jump] { right: calc(var(--u) * 15); bottom: calc(var(--u) * 29); width: calc(var(--u) * 20); height: calc(var(--u) * 20); }
  .tb[data-a=gren] { right: calc(var(--u) * 31); bottom: calc(var(--u) * 8);  width: calc(var(--u) * 18); height: calc(var(--u) * 18); }
  #dpad i.on, .tb.on, #tpause.on { background: rgba(255, 70, 70, .38); border-color: rgba(255, 150, 150, .8); color: #fff; }
  #tpause { right: calc(var(--u) * 2); top: calc(var(--u) * 15); width: calc(var(--u) * 11); height: calc(var(--u) * 11); font-size: calc(var(--u) * 3.4); }

  #install {
    position: fixed; z-index: 6; left: calc(var(--u) * 2); top: calc(var(--u) * 21); padding: calc(var(--u) * 1.6) calc(var(--u) * 2.4);
    background: rgba(160, 20, 40, .55); border: 2px solid rgba(255, 255, 255, .5); border-radius: 8px;
    color: #fff; font: 700 calc(var(--u) * 2.6) monospace;
  }
  /* aviso para girar el móvil */
  @media (orientation: portrait) {
    body.touch #touch { display: none; }
    body.touch #rotate { display: flex; position: fixed; inset: 0; z-index: 9; background: #07010a; color: #ff3b3b; font: 700 20px monospace; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  }
</style>
</head>
<body>
<canvas id="c" width="960" height="540" tabindex="0"></canvas>

<div id="touch">
  <div id="dpad"><i data-d="up"></i><i data-d="left"></i><i data-d="right"></i><i data-d="down"></i></div>
  <button class="tb" data-a="jump" type="button">SALTO</button>
  <button class="tb" data-a="fire" type="button">FUEGO</button>
  <button class="tb" data-a="gren" type="button">BOMBA</button>
  <button class="tb" id="tpause" type="button" aria-label="Pausa">II</button>
</div>
<div id="rotate">GIRA EL MOVIL<br>PARA JUGAR (HORIZONTAL)</div>
<button id="install" type="button">INSTALAR APP</button>

<script src="js/atlas.js"></script>
<script src="js/game.js"></script>
<script src="js/touch.js"></script>
</body>
</html>
